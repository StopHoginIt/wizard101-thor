name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build W101Quick
        working-directory: launcher
        run: |
          go mod tidy
          GOOS=windows go vet ./...
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "-s -w -H windowsgui" -o ../dist/W101Quick-arm64.exe .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o ../dist/W101Quick-amd64.exe .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build W101 Panel (Android)
        run: |
          gradle -p panel --no-daemon assembleRelease
          cp panel/app/build/outputs/apk/release/app-release.apk dist/W101Panel.apk
      - name: Check profile
        run: |
          python3 tools/make_profile.py /tmp/gen.icp
          python3 tools/validate_profile.py profiles/Wizard101-Thor-v6.icp
      - name: Package extras
        run: |
          cp profiles/*.icp companion/W101-Companion.html dist/
          (cd laptop && zip -q ../dist/laptop-tools.zip *)
      - uses: actions/upload-artifact@v4
        with:
          name: wizard101-thor
          path: dist/*
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released; nothing to do"; exit 0
          fi
          NOTES="release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" "${ARGS[@]}"
      - name: Nightly (test builds)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" --title "Nightly (untested)" \
            --notes "Test build of $GITHUB_SHA. Use the latest numbered release unless you're testing."
