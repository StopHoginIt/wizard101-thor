name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build W101Quick
        working-directory: launcher
        run: |
          go mod tidy
          GOOS=windows go vet ./...
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "-s -w -H windowsgui" -o ../dist/W101Quick-arm64.exe .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o ../dist/W101Quick-amd64.exe .
      - name: Check profile
        run: |
          python3 tools/make_profile.py /tmp/gen.icp
          python3 tools/validate_profile.py profiles/Wizard101-Thor-v6.icp
      - name: Package extras
        run: |
          cp profiles/*.icp companion/W101-Companion.html dist/
          (cd laptop && zip -q ../dist/laptop-tools.zip *)
      - uses: actions/upload-artifact@v4
        with:
          name: wizard101-thor
          path: dist/*
      - name: Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
